<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A minimal, browser-local task time logger with a weekly view and CSV export.">
  <title>Time Log</title>
  <style>
    :root {
      --background:#f5f5f1; --surface:#fff; --soft:#f8f8f5; --text:#191a17;
      --muted:#72756d; --border:#dedfd9; --accent:#255f3b; --hover:#19482b;
      --bar:#dce3dc; --grid:#e7e8e3;
      --shadow:0 1px 2px rgba(24,26,23,.04),0 14px 40px rgba(24,26,23,.05);
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--background);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit} button{cursor:pointer} button:disabled{cursor:not-allowed;opacity:.45}
    .shell{min-height:100vh;padding:64px 20px 40px}.page{width:min(100%,940px);margin:auto}
    .header{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:28px}
    .eyebrow,.kicker{margin:0 0 7px;color:var(--accent);font-size:.72rem;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
    h1,h2,p{margin-top:0} h1{margin-bottom:0;font-size:clamp(2.1rem,5vw,3.7rem);font-weight:620;letter-spacing:-.055em;line-height:1}
    h2{margin-bottom:0;font-size:1.08rem;font-weight:680;letter-spacing:-.02em}
    .stats{display:flex;gap:30px;padding-bottom:2px}.stats div{display:grid;gap:4px;min-width:78px}
    .stats span{color:var(--muted);font-size:.72rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
    .stats strong{font-size:1.25rem;font-variant-numeric:tabular-nums}
    .card{margin-bottom:16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
    .log-card{padding:22px}.log-card h2{margin-bottom:15px}
    .form{display:grid;grid-template-columns:minmax(220px,1.7fr) minmax(110px,.65fr) minmax(150px,.85fr) auto;align-items:end;gap:12px}
    .field{display:grid;gap:7px}.field label{color:var(--muted);font-size:.76rem;font-weight:650}
    .field input,.field select{width:100%;height:44px;border:1px solid var(--border);border-radius:9px;outline:none;background:var(--soft);color:var(--text);padding:0 12px}
    .field input:focus,.field select:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 86%)}
    .task-field{grid-template-columns:minmax(0,1fr)}.task-field.new{grid-template-columns:.8fr 1.2fr}.task-field label{grid-column:1/-1}
    .primary,.secondary,.week-nav button{height:44px;border-radius:9px;font-weight:680}
    .primary{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:0 20px}.primary:hover{background:var(--hover);border-color:var(--hover)}
    .chart-card,.entries-card,.projects-card{padding:24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
    .week-nav{display:flex;gap:6px}.week-nav button,.secondary{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:0 13px}
    .week-nav button:hover,.secondary:hover{border-color:#b7b9b2;background:var(--soft)}
    .chart-wrap{width:100%;overflow-x:auto}.chart{display:block;width:100%;min-width:610px;height:auto}
    .grid{stroke:var(--grid);stroke-width:1}.axis,.day,.date-label,.empty-chart{fill:var(--muted);font-family:inherit}.axis,.date-label{font-size:10px}
    .day{fill:var(--text);font-size:11px;font-weight:650}.empty-chart{font-size:14px}.bar-segment{stroke:var(--surface);stroke-width:1}
    .task-line{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.4}
    .legend{display:flex;flex-wrap:wrap;gap:9px 18px;min-height:20px;padding:2px 7px 0 50px}.legend-item{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:.76rem}
    .legend-swatch{width:11px;height:11px;border-radius:3px}
    .entries-head{margin-bottom:14px}.secondary{height:38px;font-size:.82rem}.entry-list{border-top:1px solid var(--border)}
    .entry{display:grid;grid-template-columns:minmax(0,1fr) auto auto 28px;align-items:center;gap:14px;min-height:66px;border-bottom:1px solid var(--border)}.entry:last-child{border-bottom:0}
    .entry>div:first-child{display:grid;gap:3px;min-width:0}.entry strong{overflow:hidden;font-size:.92rem;text-overflow:ellipsis;white-space:nowrap}.entry span{color:var(--muted);font-size:.76rem}
    .entry-time{font-weight:700;font-variant-numeric:tabular-nums}.increment{display:flex;align-items:center;gap:5px}.increment input{width:54px;height:32px;border:1px solid var(--border);border-radius:7px;background:var(--soft);color:var(--text);padding:0 7px;text-align:right}.increment button{width:32px;height:32px;border:1px solid var(--border);border-radius:7px;background:var(--surface);color:var(--accent);font-weight:800}.increment button:hover{border-color:var(--accent);background:var(--soft)}.delete{width:28px;height:28px;border:0;border-radius:50%;background:transparent;color:#999c94;font-size:1.2rem;line-height:1}.delete:hover{background:#fff0ee;color:#b42318}
    .empty-state{margin:0;border-top:1px solid var(--border);color:var(--muted);padding:28px 0 8px;font-size:.88rem}.note{margin:24px 0 0;color:var(--muted);font-size:.76rem;text-align:center}
    .new-project,.new-item{display:flex;align-items:center;gap:8px}.new-project input,.new-item input,.percent input,.deadline-input{height:38px;border:1px solid var(--border);border-radius:8px;outline:none;background:var(--soft);color:var(--text);padding:0 10px}.new-project input[type="text"]{width:min(220px,36vw)}.new-project input[type="date"]{width:145px}
    .project-list{display:grid;gap:16px}.project{border-top:1px solid var(--border);padding-top:18px}.project:first-child{border-top:0;padding-top:0}.project.deadline-today{margin:0 -12px;padding:18px 12px 12px;border-radius:10px;background:rgba(210,35,35,.075)}.project.deadline-today:first-child{padding-top:12px}.project-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.project-title{display:grid;gap:7px;min-width:0}.project-head h3{margin:0;font-size:.98rem}.deadline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.deadline-input{width:140px;height:32px;font-size:.78rem}.countdown{color:var(--muted);font-size:.77rem;font-weight:650}.countdown.due{color:#b42318}.progress-list{display:grid;gap:12px}.progress-row{display:grid;grid-template-columns:minmax(120px,190px) minmax(180px,1fr) 72px 28px;align-items:center;gap:12px}.progress-label{overflow:hidden;font-size:.86rem;font-weight:620;text-overflow:ellipsis;white-space:nowrap}.progress-track{height:18px;overflow:hidden;border-radius:5px;background:var(--grid)}.progress-fill{height:100%;border-radius:inherit;opacity:.72;transition:width 180ms ease}.percent,.new-item-percent{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:.78rem}.percent input{width:52px;padding:0 6px;text-align:right}.new-item{margin-top:16px;padding-left:202px}.new-item>input:first-child{min-width:0;flex:1}.new-item-percent input{width:64px}
    @media(max-width:760px){.shell{padding:34px 14px 28px}.header{align-items:flex-start;flex-direction:column;gap:22px}.stats{width:100%}.form{grid-template-columns:1fr 1fr}.task-field{grid-column:1/-1}.primary{grid-column:1/-1}.chart-card,.entries-card,.log-card{padding:18px}.legend{padding-left:0}}
    @media(max-width:480px){.form{grid-template-columns:1fr}.task-field,.primary{grid-column:auto}.task-field.new{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.entries-head{align-items:center;flex-direction:row}.new-project{width:100%;flex-wrap:wrap}.new-project input[type="text"]{width:100%}.new-project input[type="date"]{flex:1}.week-nav{width:100%}.week-nav button:nth-child(2){flex:1}.entry{grid-template-columns:minmax(0,1fr) auto 28px;gap:10px;padding:10px 0}.entry-time{grid-column:2}.increment{grid-column:1/3;grid-row:2}.delete{grid-column:3;grid-row:1/3}}
    @media(prefers-color-scheme:dark){:root{--background:#111310;--surface:#181b17;--soft:#1e211d;--text:#f0f1ed;--muted:#a3a79e;--border:#30342e;--accent:#62b47b;--hover:#75c48c;--bar:#303a31;--grid:#2b2e29;--shadow:none}.delete:hover{background:#3a2220;color:#ff9d95}}
  </style>
</head>
<body>
  <main class="shell"><div class="page">
    <header class="header">
      <div><p class="eyebrow">Bingo Work 🤖</p><h1>Where the week went.</h1></div>
      <div class="stats" aria-label="Time summary">
        <div><span>Today</span><strong id="today-total">0m</strong></div>
        <div><span>This week</span><strong id="week-total">0m</strong></div>
      </div>
    </header>

    <section class="card log-card" aria-labelledby="log-heading">
      <h2 id="log-heading">Log time</h2>
      <form class="form" id="log-form">
        <div class="field task-field new" id="task-field">
          <label for="task">Task</label>
          <select id="task"></select>
          <input id="new-task" aria-label="New task name" maxlength="80" placeholder="e.g. Writing">
        </div>
        <div class="field"><label for="minutes">Minutes</label><input id="minutes" inputmode="numeric" min="1" placeholder="60" required step="1" type="number"></div>
        <div class="field"><label for="date">Date</label><input id="date" required type="date"></div>
        <button class="primary" type="submit">Log time</button>
      </form>
    </section>

    <section class="card chart-card" aria-labelledby="week-heading">
      <div class="section-head">
        <div><p class="kicker">Weekly view</p><h2 id="week-heading"></h2></div>
        <div class="week-nav" aria-label="Choose week">
          <button type="button" id="previous-week" aria-label="Previous week">←</button>
          <button type="button" id="this-week">This week</button>
          <button type="button" id="next-week" aria-label="Next week">→</button>
        </div>
      </div>
      <div class="chart-wrap" id="chart-wrap"></div>
      <div class="legend" id="legend" aria-label="Chart legend"></div>
    </section>

    <section class="card entries-card" aria-labelledby="entries-heading">
      <div class="section-head entries-head">
        <div><p class="kicker">History</p><h2 id="entries-heading">Logged entries</h2></div>
        <button class="secondary" id="export" type="button">Export CSV</button>
      </div>
      <div id="entries"></div>
    </section>
    <section class="card projects-card" aria-labelledby="projects-heading">
      <div class="section-head">
        <div><p class="kicker">Progress</p><h2 id="projects-heading">Projects</h2></div>
        <form class="new-project" id="new-project-form"><input id="new-project-name" type="text" maxlength="100" placeholder="e.g. Current BFI paper" aria-label="New project name"><input id="new-project-deadline" type="date" aria-label="Project deadline"><button class="secondary" type="submit">Add project</button></form>
      </div>
      <div id="projects"></div>
    </section>
    <p class="note">Saved locally in this browser.</p>
  </div></main>

  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "task_time_logger_v1";
      const PROJECTS_KEY = "task_progress_logger_v1";
      const NEW_TASK = "__new_task__";
      const COLORS = [
        "#0072B2","#E69F00","#009E73","#CC79A7","#D55E00",
        "#56B4E9","#F0E442","#6A3D9A","#1B9E77","#E7298A",
        "#A6761D","#666666","#E41A1C","#377EB8","#4DAF4A",
        "#984EA3","#FF7F00","#A65628","#F781BF","#17A2A4"
      ];
      let data = { tasks: [], entries: [] };
      let projects = [];
      let weekStart = mondayOf(new Date());

      const $ = (id) => document.getElementById(id);
      const taskSelect = $("task"), newTaskInput = $("new-task"), minutesInput = $("minutes"), dateInput = $("date");

      function localISODate(date = new Date()) {
        return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
      }
      function parseDate(value) { const [y,m,d] = value.split("-").map(Number); return new Date(y,m-1,d,12); }
      function mondayOf(date) { const copy = new Date(date.getFullYear(),date.getMonth(),date.getDate(),12); const day = copy.getDay() || 7; copy.setDate(copy.getDate()-day+1); return copy; }
      function addDays(date,n) { const copy = new Date(date); copy.setDate(copy.getDate()+n); return copy; }
      function formatMinutes(n) { const h=Math.floor(n/60), m=n%60; return !h?`${m}m`:!m?`${h}h`:`${h}h ${m}m`; }
      function shortDate(date) { return new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric"}).format(date); }
      function longDate(value) { return new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"}).format(parseDate(value)); }
      function deadlineStatus(value) {
        if(!value)return "";
        const today=parseDate(localISODate()),deadline=parseDate(value);
        const days=Math.round((deadline-today)/86400000);
        return days===0?"Due today":days===1?"1 day left":days>1?`${days} days left`:days===-1?"1 day overdue":`${Math.abs(days)} days overdue`;
      }
      function escapeHTML(value) { return String(value).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
      function csvCell(value) { const s=String(value); return /[",\n]/.test(s)?`"${s.replaceAll('"','""')}"`:s; }
      function save() { localStorage.setItem(STORAGE_KEY,JSON.stringify(data)); render(); }
      function saveProjects() { localStorage.setItem(PROJECTS_KEY,JSON.stringify(projects)); renderProjects(); }

      function load() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (parsed && Array.isArray(parsed.tasks) && Array.isArray(parsed.entries)) data = parsed;
          const savedProjects = JSON.parse(localStorage.getItem(PROJECTS_KEY));
          if (Array.isArray(savedProjects)) projects = savedProjects;
        } catch (_) {}
        dateInput.value = localISODate();
        render();
      }

      function renderTasks(selected) {
        const choice = selected || taskSelect.value || data.tasks[0] || NEW_TASK;
        taskSelect.innerHTML = data.tasks.map(task=>`<option value="${escapeHTML(task)}">${escapeHTML(task)}</option>`).join("") + `<option value="${NEW_TASK}">+ New task…</option>`;
        taskSelect.value = data.tasks.includes(choice) ? choice : NEW_TASK;
        const isNew = taskSelect.value === NEW_TASK;
        newTaskInput.hidden = !isNew;
        $("task-field").classList.toggle("new",isNew);
      }

      function render() {
        renderTasks();
        const keys = Array.from({length:7},(_,i)=>localISODate(addDays(weekStart,i)));
        const weekEntries = data.entries.filter(entry=>keys.includes(entry.date));
        $("today-total").textContent = formatMinutes(data.entries.filter(e=>e.date===localISODate()).reduce((s,e)=>s+Number(e.minutes),0));
        $("week-total").textContent = formatMinutes(weekEntries.reduce((s,e)=>s+Number(e.minutes),0));
        $("week-heading").textContent = `${shortDate(weekStart)} – ${shortDate(addDays(weekStart,6))}`;
        renderChart(weekEntries,keys);
        renderEntries();
        renderProjects();
      }

      function renderChart(weekEntries,keys) {
        const days = keys.map(parseDate), tasks = [...new Set(weekEntries.map(e=>e.task))].sort();
        const series = tasks.map((task,i)=>({task,color:COLORS[i%COLORS.length],values:keys.map(date=>weekEntries.filter(e=>e.date===date&&e.task===task).reduce((s,e)=>s+Number(e.minutes),0))}));
        const totals = keys.map((_,i)=>series.reduce((s,row)=>s+row.values[i],0));
        const w=760,h=310,m={top:25,right:18,bottom:50,left:50},pw=w-m.left-m.right,ph=h-m.top-m.bottom;
        const max=Math.ceil(Math.max(60,...totals,...series.flatMap(s=>s.values))/60)*60;
        const x=i=>m.left+((i+.5)*pw)/7, y=v=>m.top+ph-(v/max)*ph, bw=Math.min(58,pw/9.2);
        const ticks=Array.from({length:5},(_,i)=>max*i/4);
        let svg=`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Daily total time as bars and time per task as lines for the selected week">`;
        ticks.forEach(t=>{svg+=`<line class="grid" x1="${m.left}" x2="${w-m.right}" y1="${y(t)}" y2="${y(t)}"/><text class="axis" x="${m.left-10}" y="${y(t)+4}" text-anchor="end">${t?Number((t/60).toFixed(1))+"h":"0"}</text>`});
        totals.forEach((total,i)=>{
          let stacked=0;
          series.forEach(row=>{
            const value=row.values[i];
            if(!value)return;
            const top=y(stacked+value),bottom=y(stacked);
            svg+=`<rect class="bar-segment" x="${x(i)-bw/2}" y="${top}" width="${bw}" height="${Math.max(0,bottom-top)}" rx="2" fill="${row.color}" fill-opacity="0.6"><title>${escapeHTML(days[i].toLocaleDateString()+", "+row.task+": "+formatMinutes(value))}</title></rect>`;
            stacked+=value;
          });
          svg+=`<text class="day" x="${x(i)}" y="${h-25}" text-anchor="middle">${days[i].toLocaleDateString(undefined,{weekday:"short"})}</text><text class="date-label" x="${x(i)}" y="${h-9}" text-anchor="middle">${shortDate(days[i])}</text>`;
        });
      //  series.forEach(row=>{svg+=`<polyline class="task-line" points="${row.values.map((v,i)=>`${x(i)},${y(v)}`).join(" ")}" stroke="${row.color}"/>`;row.values.forEach((v,i)=>{svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${row.color}"><title>${escapeHTML(row.task+": "+formatMinutes(v))}</title></circle>`})});
        if(!weekEntries.length) svg+=`<text class="empty-chart" x="${w/2}" y="${h/2}" text-anchor="middle">No time logged this week</text>`;
        $("chart-wrap").innerHTML=svg+"</svg>";
        $("legend").innerHTML=series.map(row=>`<span class="legend-item"><span class="legend-swatch" style="background:${row.color}"></span>${escapeHTML(row.task)}</span>`).join("");
      }

      function renderEntries() {
        const entries=[...data.entries].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));
        $("export").disabled=!entries.length;
        $("entries").innerHTML=!entries.length?`<p class="empty-state">Your entries will appear here.</p>`:`<div class="entry-list">${entries.map(e=>`<article class="entry"><div><strong>${escapeHTML(e.task)}</strong><span>${longDate(e.date)}</span></div><div class="entry-time">${formatMinutes(Number(e.minutes))}</div><div class="increment"><input type="number" min="1" step="1" value="30" data-increment-value="${escapeHTML(e.id)}" aria-label="Minutes to add to ${escapeHTML(e.task)}"><button type="button" data-increment="${escapeHTML(e.id)}" aria-label="Add minutes to ${escapeHTML(e.task)}" title="Add minutes">↑</button></div><button class="delete" type="button" data-delete="${escapeHTML(e.id)}" aria-label="Delete ${escapeHTML(e.task)} entry">×</button></article>`).join("")}</div>`;
      }

      function renderProjects() {
        $("projects").innerHTML=!projects.length?`<p class="empty-state">Add a project, then add the pieces you want to track.</p>`:`<div class="project-list">${projects.map(project=>{const status=deadlineStatus(project.deadline),due=project.deadline===localISODate();return `<article class="project${due?" deadline-today":""}"><div class="project-head"><div class="project-title"><h3>${escapeHTML(project.name)}</h3><div class="deadline"><input class="deadline-input" type="date" value="${escapeHTML(project.deadline||"")}" data-deadline="${escapeHTML(project.id)}" aria-label="Deadline for ${escapeHTML(project.name)}"><span class="countdown${due||status.includes("overdue")?" due":""}">${escapeHTML(status||"No deadline")}</span></div></div><button class="delete" type="button" data-delete-project="${escapeHTML(project.id)}" aria-label="Delete ${escapeHTML(project.name)}">×</button></div><div class="progress-list">${project.items.map((item,index)=>`<div class="progress-row"><div class="progress-label" title="${escapeHTML(item.name)}">${escapeHTML(item.name)}</div><div class="progress-track"><div class="progress-fill" style="width:${Number(item.percent)}%;background:${COLORS[index%COLORS.length]}"></div></div><div class="percent"><input type="number" min="0" max="100" value="${Number(item.percent)}" data-project="${escapeHTML(project.id)}" data-progress="${escapeHTML(item.id)}" aria-label="${escapeHTML(item.name)} completion percentage"><span>%</span></div><button class="delete" type="button" data-delete-item="${escapeHTML(item.id)}" data-project="${escapeHTML(project.id)}" aria-label="Delete ${escapeHTML(item.name)}">×</button></div>`).join("")}</div><form class="new-item" data-add-item="${escapeHTML(project.id)}"><input maxlength="100" placeholder="e.g. Related work" required aria-label="New item for ${escapeHTML(project.name)}"><div class="new-item-percent"><input type="number" min="0" max="100" value="0" required aria-label="Starting percentage"><span>%</span></div><button class="secondary" type="submit">Add item</button></form></article>`}).join("")}</div>`;
      }

      taskSelect.addEventListener("change",()=>renderTasks(taskSelect.value));
      $("log-form").addEventListener("submit",event=>{
        event.preventDefault();
        const task=taskSelect.value===NEW_TASK?newTaskInput.value.trim():taskSelect.value;
        const minutes=Math.round(Number(minutesInput.value));
        if(!task||!dateInput.value||!Number.isFinite(minutes)||minutes<=0)return;
        if(!data.tasks.includes(task))data.tasks.push(task);
        data.entries.push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,task,date:dateInput.value,minutes,createdAt:new Date().toISOString()});
        newTaskInput.value="";minutesInput.value="";dateInput.value=localISODate();
        save();renderTasks(task);
      });
      $("entries").addEventListener("click",event=>{
        const incrementButton=event.target.closest("[data-increment]");
        if(incrementButton){
          const input=$("entries").querySelector(`[data-increment-value="${CSS.escape(incrementButton.dataset.increment)}"]`);
          const amount=Math.round(Number(input?.value));
          const entry=data.entries.find(e=>e.id===incrementButton.dataset.increment);
          if(entry&&Number.isFinite(amount)&&amount>0){entry.minutes=Number(entry.minutes)+amount;save();}
          return;
        }
        const button=event.target.closest("[data-delete]");
        if(!button||!confirm("Delete this entry?"))return;
        data.entries=data.entries.filter(e=>e.id!==button.dataset.delete);save();
      });
      $("previous-week").addEventListener("click",()=>{weekStart=addDays(weekStart,-7);render()});
      $("next-week").addEventListener("click",()=>{weekStart=addDays(weekStart,7);render()});
      $("this-week").addEventListener("click",()=>{weekStart=mondayOf(new Date());render()});
      $("export").addEventListener("click",()=>{
        const rows=[["task","date","minutes","hours"],...[...data.entries].sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt)).map(e=>[e.task,e.date,e.minutes,(e.minutes/60).toFixed(2)])];
        const blob=new Blob([rows.map(row=>row.map(csvCell).join(",")).join("\n")],{type:"text/csv;charset=utf-8"});
        const url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=`time-log-${localISODate()}.csv`;link.click();URL.revokeObjectURL(url);
      });
      $("new-project-form").addEventListener("submit",event=>{
        event.preventDefault();const input=$("new-project-name"),deadlineInput=$("new-project-deadline"),name=input.value.trim();if(!name)return;
        projects.push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,name,deadline:deadlineInput.value,items:[]});input.value="";deadlineInput.value="";saveProjects();
      });
      $("projects").addEventListener("submit",event=>{
        const form=event.target.closest("[data-add-item]");if(!form)return;event.preventDefault();
        const inputs=form.querySelectorAll("input"),name=inputs[0].value.trim(),percent=Math.max(0,Math.min(100,Math.round(Number(inputs[1].value))));
        const project=projects.find(p=>p.id===form.dataset.addItem);if(!project||!name||!Number.isFinite(percent))return;
        project.items.push({id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`,name,percent});saveProjects();
      });
      $("projects").addEventListener("change",event=>{
        const deadlineInput=event.target.closest("[data-deadline]");
        if(deadlineInput){const project=projects.find(p=>p.id===deadlineInput.dataset.deadline);if(project){project.deadline=deadlineInput.value;saveProjects();}return;}
        const input=event.target.closest("[data-progress]");if(!input)return;
        const project=projects.find(p=>p.id===input.dataset.project),item=project?.items.find(i=>i.id===input.dataset.progress);
        if(item){item.percent=Math.max(0,Math.min(100,Math.round(Number(input.value)||0)));saveProjects();}
      });
      $("projects").addEventListener("click",event=>{
        const projectButton=event.target.closest("[data-delete-project]");
        if(projectButton){if(confirm("Delete this project and all of its tracked items?")){projects=projects.filter(p=>p.id!==projectButton.dataset.deleteProject);saveProjects();}return;}
        const itemButton=event.target.closest("[data-delete-item]");
        if(itemButton){const project=projects.find(p=>p.id===itemButton.dataset.project);if(project){project.items=project.items.filter(i=>i.id!==itemButton.dataset.deleteItem);saveProjects();}}
      });
      load();
    })();
  </script>
</body>
</html>
